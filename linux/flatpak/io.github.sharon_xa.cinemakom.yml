# Cinemakom as a Flatpak, the only Linux package (docs/PACKAGING.md §3).
#
#   tool/build_flatpak.sh    # builds the app, then this, into dist/
#
# The GNOME runtime brings glibc, GTK 3 and FFmpeg (H.264 and other patented
# codecs through its codecs-extra extension), so FFmpeg's security fixes
# come with runtime updates. We build only what it lacks: libass,
# libplacebo and libmpv. The app is the Flutter release bundle, built
# before this (`flutter build linux --release`).
#
# Keep the three libraries current: an mpv, libass or libplacebo security
# release means a Cinemakom release (docs/PACKAGING.md §3).
id: io.github.sharon_xa.cinemakom
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: cinemakom

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  # Downloads go to the videos folder (AppDirs). Other folders come through
  # the file chooser portal, as does Save a copy of the log.
  - --filesystem=xdg-videos
  # connectivity_plus asks NetworkManager whether the device is online
  # (downloads wait for the network and continue by themselves).
  - --system-talk-name=org.freedesktop.NetworkManager

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: libass
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc

  # mpv renders through OpenGL here (media_kit's render API), so no Vulkan.
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=disabled
      - -Dopengl=enabled
      - -Dd3d11=disabled
      - -Dglslang=disabled
      - -Dshaderc=disabled
      - -Ddemos=false
      - -Dtests=false
      - -Dbench=false
      - -Dfuzz=false
    sources:
      # Git, not a tarball: the build needs its submodules (glad, jinja,
      # fast_float).
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.387.0
        commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65

  # Only the library media_kit loads (libmpv.so.2), not the mpv player.
  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dtests=false
      - -Dfuzzers=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dspirv-cross=disabled
      - -Dcdda=disabled
      - -Ddvdnav=disabled
      - -Dlibbluray=disabled
      - -Dlibarchive=disabled
      - -Drubberband=disabled
      - -Dvapoursynth=disabled
      - -Duchardet=disabled
      - -Djack=disabled
      - -Dcuda-hwaccel=disabled
      - -Dcuda-interop=disabled
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dpdf-build=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.42.0.tar.gz
        sha256: bcfebbfa2b65a6d88dc97ea18117831072373e38b5785a2afb874ed4df5070dd

  - name: cinemakom
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/cinemakom /app/bin
      - cp -a bundle/. /app/lib/cinemakom/
      # The binary finds data/ and lib/ next to its real path
      # (/proc/self/exe), so a symlink is enough.
      - ln -s /app/lib/cinemakom/cinemakom /app/bin/cinemakom
      - install -Dm644 packaging/io.github.sharon_xa.cinemakom.desktop -t /app/share/applications
      - install -Dm644 packaging/io.github.sharon_xa.cinemakom.metainfo.xml -t /app/share/metainfo
      - mkdir -p /app/share/icons
      - cp -r packaging/icons/hicolor /app/share/icons/
    sources:
      - type: dir
        path: ../../build/linux/x64/release/bundle
        dest: bundle
      - type: dir
        path: ../packaging
        dest: packaging
