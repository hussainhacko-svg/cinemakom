name: CI

# Analyze and test pull requests, and when started by hand (Actions → CI →
# Run workflow). Pushes to main don't run it (the owner's decision,
# 2026-11-25). The release workflow runs analyze and the tests again before
# it publishes.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the pull request makes the older run pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Analyze & test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native-asset build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    # The app ships for Windows, but nothing else runs its tests there:
    # paths, file locking and line endings differ.
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter test
