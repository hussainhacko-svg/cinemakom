name: CI

# Analyze and test every push to main (commits go straight there, so a
# breaking one shows the same day, not on release day), and pull requests.
# The release workflow runs the same checks again before building.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push makes the older run pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Analyze & test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native-asset build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    # The app ships for Windows, but nothing else runs its tests there:
    # paths, file locking and line endings differ.
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter test
